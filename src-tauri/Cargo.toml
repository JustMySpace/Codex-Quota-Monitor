[package]
name = "codex-quota-monitor"
version = "0.1.0"
description = "Local Codex quota and token usage monitor"
authors = ["showm"]
edition = "2021"

[lib]
name = "codex_quota_monitor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.11.5", features = ["tray-icon"] }
